# version: "3.9"
services:
  manager_api:
    container_name: manager_api
    build:
      context: .
      dockerfile: containers/api/Dockerfile
    env_file:
      - containers/api/api.env
    networks:
      - my_network
    ports:
      - 5000:5000
    depends_on:
      manager_db:
        condition: service_healthy
    # depends_on:
    #   - manager_db
    #   - manager_esb

  manager_db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: manager_db
    env_file:
      - containers/db/db.env
    networks:
      - my_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P $${SA_PASSWORD} -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
  # manager_db:
  #   container_name: manager_db
  #   image: mcr.microsoft.com/mssql/server:2019-latest
  #   networks:
  #     - my_network
  #   env_file:
  #     - containers/db/db.env
  
  manager_esb:
    container_name: manager_esb
    image: rabbitmq:3-management
    ports:
      - 5672:5672
      - 15672:15672
    networks:
      - my_network
  
networks:
  my_network:
    driver: bridge